<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Since — what changed while you were away</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Since — design notes
     ---------------------
     One typeface (Manrope), hierarchy from weight and size alone. No serif
     display face: fintech products do not use them, and a serif over a warm
     background is the commonest signature of generated design.

     Two devices carry the whole product, and both are data rather than
     decoration:

     1. THE SPARKLINE is the price path since the user last acknowledged --
        not since the open, not the last N days. It draws the exact window
        they were away for, so "memory" is something you see rather than
        something you read about.

     2. THE RANGE BAR places this move against ticks at the real tier
        thresholds (1.5x and 2.0x a stock's own normal daily movement). It
        makes volatility normalisation legible at a glance.

     Motion appears only where it answers an action: rows settle when the
     clock moves, so you can see what re-ranked. */
  :root {
    --bg:#FFFFFF; --sub:#F4F7F5; --rule:#E8EDEA;
    --ink:#0F1E1A; --muted:#5A6B64; --faint:#8FA099;
    --green:#00B386; --green-deep:#00875F; --green-wash:#E6F7F1;
    --red:#E33E3E; --red-wash:#FDECEC;
    --amber:#E08700; --amber-wash:#FEF5E7;
    --sans:"Manrope", -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  .wrap { max-width:760px; margin:0 auto; padding:32px 22px 90px; }
  :focus-visible { outline:2px solid var(--green-deep); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }

  /* ---- masthead ---- */
  .mast { display:flex; align-items:center; gap:11px; margin-bottom:30px; }
  .logo {
    width:26px; height:26px; border-radius:8px; background:var(--green);
    display:grid; place-items:center; flex:none;
  }
  .logo svg { display:block; }
  .mark { font-size:19px; font-weight:800; letter-spacing:-.5px; }
  .mode {
    margin-left:auto; font-size:11.5px; font-weight:500; color:var(--green-deep);
    background:var(--green-wash); border-radius:100px; padding:4px 11px; white-space:nowrap;
  }

  /* ---- verdict: the one loud thing ---- */
  .verdict {
    font-size:33px; font-weight:800; line-height:1.18; letter-spacing:-1.1px;
    margin:0 0 9px; max-width:17ch;
  }
  .verdict .hit { color:var(--red); }
  .verdict.calm { color:var(--green-deep); }
  .since { color:var(--muted); font-size:14.5px; margin:0 0 3px; max-width:58ch; }
  .stamp { color:var(--faint); font-size:12.5px; margin:0 0 26px; }

  /* ---- controls ---- */
  .panel { background:var(--sub); border-radius:12px; padding:13px; margin-bottom:8px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bar + .bar { margin-top:9px; }
  input, button { font-family:var(--sans); font-size:14px; color:var(--ink); }
  input[type=text], input[type=number], input[type=datetime-local] {
    padding:8px 11px; border:1px solid var(--rule); border-radius:8px; background:var(--bg);
  }
  input[type=text] { flex:1; min-width:150px; }
  input[type=number] { width:130px; }
  button {
    padding:8px 14px; border-radius:8px; border:1px solid var(--rule);
    background:var(--bg); cursor:pointer; font-weight:500;
    transition:background .14s ease, border-color .14s ease;
  }
  button:hover { border-color:#CFDAD5; background:#FBFDFC; }
  button.go {
    background:var(--green); color:#fff; border-color:var(--green); font-weight:600;
  }
  button.go:hover { background:var(--green-deep); border-color:var(--green-deep); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  .lbl { font-size:13px; color:var(--muted); font-weight:500; }
  .note { font-size:12.5px; color:var(--faint); padding:9px 2px 0; max-width:64ch; }
  .alert {
    background:var(--red-wash); border:1px solid #F5C9C9; color:#B32B2B;
    border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:14px;
  }

  /* ---- tier groups ---- */
  .group { margin-top:26px; }
  .group-head { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .group-head h2 { font-size:13.5px; font-weight:700; margin:0; letter-spacing:-.2px; }
  .group-head .count {
    font-size:12px; font-weight:600; color:var(--faint);
    background:var(--sub); border-radius:100px; padding:1px 8px;
  }
  .g-NEEDS_ATTENTION h2 { color:var(--red); }
  .g-CHANGED h2 { color:var(--amber); }
  .g-QUIET h2 { color:var(--green-deep); }

  /* ---- rows ---- */
  .row {
    display:grid; grid-template-columns:1fr 108px; gap:14px; align-items:center;
    padding:14px 14px; border-radius:12px; border:1px solid var(--rule);
    margin-top:8px; background:var(--bg);
    animation:settle .34s cubic-bezier(.22,.8,.3,1) both;
  }
  /* Motion answers an action: when the clock moves, rows settle into their new
     rank so you can see what changed position. Nothing animates on idle. */
  @keyframes settle {
    from { opacity:0; transform:translateY(5px); }
    to   { opacity:1; transform:none; }
  }
  .row.NEEDS_ATTENTION { border-color:#F3CFCF; background:linear-gradient(90deg,var(--red-wash),var(--bg) 62%); }
  .row.CHANGED { border-color:#F0DCB8; background:linear-gradient(90deg,var(--amber-wash),var(--bg) 62%); }

  .head { display:flex; align-items:baseline; gap:9px; }
  .tick { font-weight:700; letter-spacing:-.3px; }
  .co { color:var(--faint); font-size:12px; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .why { margin:7px 0 0; padding:0; list-style:none; }
  .why li { color:var(--muted); font-size:13.5px; padding:.5px 0; max-width:62ch; }
  .why li.flag { color:var(--amber); font-weight:500; }

  /* range bar: |z| against the real tier thresholds */
  .range { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .track { position:relative; height:6px; width:140px; flex:none;
           background:var(--sub); border-radius:100px; overflow:hidden; }
  .fill { position:absolute; top:0; bottom:0; left:0; border-radius:100px;
          animation:grow .5s cubic-bezier(.22,.8,.3,1) both; }
  @keyframes grow { from { width:0 !important; } }
  .fill.NEEDS_ATTENTION { background:var(--red); }
  .fill.CHANGED { background:var(--amber); }
  .fill.QUIET { background:#BCCCC5; }
  .notch { position:absolute; top:-1px; bottom:-1px; width:1.5px; background:var(--bg); }
  .scale { font-size:11.5px; color:var(--faint); font-weight:500; }

  .foot { display:flex; align-items:center; gap:11px; margin-top:8px;
          font-size:11.5px; flex-wrap:wrap; }
  .fresh { display:inline-flex; align-items:center; gap:5px; color:var(--faint); }
  .dot { width:6px; height:6px; border-radius:50%; flex:none; }
  .fresh.LIVE .dot { background:var(--green); }
  .fresh.DELAYED .dot { background:var(--amber); }
  .fresh.CLOSED .dot { background:var(--faint); }
  .fresh.STALE .dot, .fresh.UNAVAILABLE .dot { background:var(--red); }
  .fresh.STALE, .fresh.UNAVAILABLE { color:var(--red); }
  .basis { color:var(--faint); }
  .drop { margin-left:auto; background:none; border:none; color:var(--faint);
          font-size:11.5px; padding:2px 5px; cursor:pointer; }
  .drop:hover { color:var(--red); background:none; }

  /* ---- right rail: price, change, and the path you missed ---- */
  .rail { text-align:right; }
  .px { font-size:14.5px; font-weight:600; }
  .delta { font-size:13px; font-weight:700; margin-top:1px; }
  .delta.up { color:var(--green-deep); } .delta.down { color:var(--red); }
  .spark { display:block; margin:5px 0 0 auto; }
  .spark path { fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;
                stroke-dasharray:1000; animation:draw 1s ease-out both; }
  @keyframes draw { from { stroke-dashoffset:1000; } to { stroke-dashoffset:0; } }
  .spark .area { stroke:none; opacity:.13; animation:none; }

  .blank { padding:40px 4px; color:var(--muted); max-width:44ch; }
  .blank strong { font-size:20px; font-weight:700; display:block; margin-bottom:6px;
                  color:var(--ink); letter-spacing:-.4px; }

  @media (max-width:600px) {
    .verdict { font-size:27px; }
    .row { grid-template-columns:1fr 92px; gap:10px; }
    .co { display:none; }
    .track { width:104px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <span class="logo" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 10.5L4.6 6.2L7.6 8.4L13 2" stroke="#fff" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="mark">Since</span>
    <span class="mode" id="mode">loading</span>
  </div>

  <h1 class="verdict" id="verdict">Reading the market…</h1>
  <p class="since" id="since"></p>
  <p class="stamp" id="stamp"></p>

  <div id="alert"></div>

  <div class="panel">
    <div class="bar">
      <input type="text" id="sym" list="syms" autocomplete="off"
             placeholder="Add a stock, e.g. RELIANCE.NS" aria-label="Symbol">
      <datalist id="syms"></datalist>
      <input type="number" id="thr" placeholder="Tell me at ₹" step="0.01" min="0"
             aria-label="Price level">
      <button id="add">Add</button>
    </div>
    <div class="bar">
      <span class="lbl">Looking at</span>
      <input type="datetime-local" id="clock" step="60" aria-label="Viewing time">
      <button id="latest">Latest</button>
      <button class="go" id="ack">Mark all as seen</button>
    </div>
  </div>
  <p class="note" id="note"></p>

  <div id="list"></div>
</div>

<script>
const HDRS = { "Content-Type":"application/json", "X-User":"demo@since.app" };
let span = null, clockValue = null;

const $ = id => document.getElementById(id);
const money = n => n == null ? "—"
  : n.toLocaleString("en-IN", { minimumFractionDigits:2, maximumFractionDigits:2 });
const when = iso => new Date(iso).toLocaleString("en-IN",
  { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", hour12:true });

const alertUser = m => $("alert").innerHTML = m ? `<div class="alert">${m}</div>` : "";

async function api(path, opts = {}) {
  const res = await fetch(path, { headers:HDRS, ...opts });
  if (!res.ok) {
    let d = res.statusText;
    try { d = (await res.json()).detail || d; } catch {}
    throw new Error(d);
  }
  return res.status === 204 ? null : res.json();
}

// The '+' in a +05:30 offset decodes server-side as a space, so the clock
// parameter has to be encoded.
const at = () => clockValue ? "?at=" + encodeURIComponent(clockValue) : "";

async function boot() {
  try {
    const [health, demo, list] = await Promise.all([
      api("/api/health"), api("/api/demo/span"), api("/api/instruments")
    ]);
    $("mode").textContent = demo.span ? "replaying recorded NSE data" : "live market";
    $("syms").innerHTML = list.results
      .map(i => `<option value="${i.symbol}">${i.display_name}</option>`).join("");
    if (demo.span) {
      span = demo.span;
      $("clock").min = span[0].slice(0,16);
      $("clock").max = span[1].slice(0,16);
      $("clock").value = span[1].slice(0,16);
      clockValue = span[1];
      $("note").textContent = `Every price here was recorded from the NSE between `
        + `${when(span[0])} and ${when(span[1])}. Nothing is simulated — move the `
        + `clock to replay it.`;
    } else {
      $("clock").style.display = "none";
      $("latest").style.display = "none";
      $("note").textContent = "Live prices from the NSE.";
    }
    await load();
  } catch (e) {
    alertUser("The server isn't responding. Start it with: uvicorn app.api:app --reload");
  }
}

async function load() {
  try { alertUser(""); render(await api("/api/digest" + at())); }
  catch (e) { alertUser("Couldn't load your watchlist. " + e.message); }
}

function render(d) {
  const v = $("verdict");
  if (!d.total) {
    v.textContent = "Nothing to watch yet."; v.className = "verdict";
    $("since").textContent = ""; $("stamp").textContent = "";
    $("list").innerHTML = `<div class="blank"><strong>Add a stock above.</strong>
      From then on, Since remembers where you left off and tells you only what
      actually moved.</div>`;
    return;
  }

  const c = d.counts || {};
  const attn = c.NEEDS_ATTENTION || 0, chg = c.CHANGED || 0;

  // An honest quiet day is a real answer, not an empty state. A watchlist that
  // can say "nothing needs you" is more trustworthy than one that always
  // manufactures something.
  if (!attn && !chg) {
    v.textContent = "Nothing needs you."; v.className = "verdict calm";
  } else if (attn) {
    v.innerHTML = `<span class="hit">${attn}</span> of ${d.total} `
      + `${attn === 1 ? "needs" : "need"} a look.`;
    v.className = "verdict";
  } else {
    v.innerHTML = `${chg} moved, none urgently.`; v.className = "verdict";
  }

  const basis = new Set(Object.values(d.tiers || {}).flat().map(i => i.comparison));
  $("since").textContent = basis.has("since you last checked")
    ? "Measured from the moment you last marked these as seen."
    : "Measured from the previous close — mark them as seen to start tracking.";
  $("stamp").textContent = "Prices as of " + when(d.as_of);

  const title = { NEEDS_ATTENTION:"Needs a look", CHANGED:"Moved", QUIET:"Quiet" };
  let html = "";
  for (const tier of ["NEEDS_ATTENTION","CHANGED","QUIET"]) {
    const items = (d.tiers || {})[tier] || [];
    if (!items.length) continue;
    html += `<section class="group g-${tier}">
      <div class="group-head"><h2>${title[tier]}</h2>
      <span class="count">${items.length}</span></div>
      ${items.map(row).join("")}</section>`;
  }
  $("list").innerHTML = html;

  document.querySelectorAll(".drop").forEach(b => b.onclick = async () => {
    try { await api("/api/watchlist/" + b.dataset.id, { method:"DELETE" }); load(); }
    catch (e) { alertUser(e.message); }
  });
}

// The exact window the user was away for, drawn from real recorded prices.
function sparkline(points, rising) {
  if (!points || points.length < 2) return "";
  const W = 104, H = 30, P = 2;
  const lo = Math.min(...points), hi = Math.max(...points);
  const range = hi - lo || 1;
  const x = i => P + (i / (points.length - 1)) * (W - P * 2);
  const y = p => H - P - ((p - lo) / range) * (H - P * 2);
  const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join("");
  const stroke = rising ? "var(--green)" : "var(--red)";
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"
            aria-hidden="true">
    <path class="area" d="${line}L${x(points.length-1).toFixed(1)},${H}L${x(0).toFixed(1)},${H}Z"
          fill="${stroke}"/>
    <path d="${line}" stroke="${stroke}"/>
  </svg>`;
}

function row(i) {
  // Company names are currently derived from the ticker, so most match it
  // exactly. Printing "ADANIENT ADANIENT" on every row reads as unfinished, so
  // the name only appears when it actually adds something.
  const ticker = i.symbol.replace(".NS", "");
  const dir = i.pct_change > 0 ? "up" : i.pct_change < 0 ? "down" : "";
  const sign = i.pct_change > 0 ? "+" : "";
  const z = i.z == null ? null : Math.abs(i.z);

  // Notches sit at the ACTUAL tier thresholds, so the picture and the rule
  // cannot disagree. Drawing them at a tidy 1x and 2x would have looked neater
  // and quietly misstated where the cutoffs are.
  const T_CHANGED = 1.5, T_ATTENTION = 2.0, T_MAX = 3.0;
  let range = "";
  if (z != null) {
    range = `<div class="range">
      <div class="track">
        <div class="fill ${i.tier}" style="width:${(Math.min(z/T_MAX,1)*100).toFixed(1)}%"></div>
        <div class="notch" style="left:${(T_CHANGED/T_MAX*100).toFixed(1)}%"></div>
        <div class="notch" style="left:${(T_ATTENTION/T_MAX*100).toFixed(1)}%"></div>
      </div>
      <span class="scale">${z.toFixed(1)}× normal</span>
    </div>`;
  }

  return `<article class="row ${i.tier}">
    <div>
      <div class="head">
        <span class="tick">${ticker}</span>
        ${i.name && i.name !== ticker ? `<span class="co">${i.name}</span>` : ""}
      </div>
      ${range}
      <ul class="why">${i.reasons.map(r =>
        `<li class="${r.type === "SUSPECTED_CORPORATE_ACTION" ? "flag" : ""}">${r.message}</li>`
      ).join("")}</ul>
      <div class="foot">
        <span class="fresh ${i.freshness}"><span class="dot"></span>${freshText(i.freshness)}</span>
        <span class="basis">${i.comparison}</span>
        ${i.threshold_price ? `<span class="basis">your level ₹${money(i.threshold_price)}</span>` : ""}
        <button class="drop" data-id="${i.instrument_id}">remove</button>
      </div>
    </div>
    <div class="rail">
      <div class="px">₹${money(i.price)}</div>
      <div class="delta ${dir}">${i.pct_change == null ? "—"
        : sign + i.pct_change.toFixed(2) + "%"}</div>
      ${sparkline(i.spark, i.pct_change >= 0)}
    </div>
  </article>`;
}

// Market-closed is not staleness: the last price of a finished session stays
// the correct answer until the next open, and calling it stale teaches people
// to distrust a good number.
function freshText(f) {
  return { LIVE:"live", DELAYED:"a few minutes old", CLOSED:"market closed",
           STALE:"not current — shown but not scored",
           UNAVAILABLE:"couldn't reach the market" }[f] || f.toLowerCase();
}

$("add").onclick = async () => {
  const symbol = $("sym").value.trim();
  if (!symbol) return;
  const t = parseFloat($("thr").value);
  try {
    await api("/api/watchlist" + at(), { method:"POST",
      body:JSON.stringify({ symbol, threshold_price: isNaN(t) ? null : t }) });
    $("sym").value = ""; $("thr").value = ""; load();
  } catch (e) { alertUser(e.message); }
};
$("sym").addEventListener("keydown", e => { if (e.key === "Enter") $("add").click(); });

$("clock").onchange = () => {
  // datetime-local carries no timezone. This is NSE data, so read it as IST.
  clockValue = $("clock").value + ":00+05:30";
  load();
};
$("latest").onclick = () => {
  if (span) { $("clock").value = span[1].slice(0,16); clockValue = span[1]; }
  load();
};

// Marking as seen is the ONLY thing that moves the watermark. Viewing does
// not, reloading does not, moving the clock does not — otherwise someone who
// glances at the screen and gets distracted loses their place silently.
$("ack").onclick = async () => {
  const b = $("ack");
  b.disabled = true; b.textContent = "Marking…";
  try {
    const r = await api("/api/acknowledge" + at(),
      { method:"POST", body:JSON.stringify({ instrument_ids: [] }) });
    b.textContent = `Marked ${r.acknowledged}`;
    await load();
  } catch (e) { alertUser(e.message); }
  setTimeout(() => { b.disabled = false; b.textContent = "Mark all as seen"; }, 900);
};

boot();
</script>
</body>
</html>
